name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/ci_scope.test.mjs
      - run: git diff --check HEAD^ HEAD
      - id: scope
        run: node scripts/ci_scope.mjs scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  quality:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      - run: node scripts/check-content.mjs
      - run: npm run build
      - name: Record the built revision
        run: git rev-parse HEAD > dist/.ci_source_sha
      - name: Share this build with browser shards
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  browser:
    needs: [scope, quality]
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/
      - name: Verify the build matches this checkout
        run: test "$(cat dist/.ci_source_sha)" = "$(git rev-parse HEAD)"
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check map and home browser flows
        run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      - name: Save browser report and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-evidence-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  site_checks:
    if: always()
    needs: [scope, quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every applicable check
        run: node scripts/ci_scope.mjs gate
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
